name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
  PRIVACYGUARD_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  PRIVACYGUARD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  PRIVACYGUARD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
  PRIVACYGUARD_NDK_VERSION: "27.3.13750724"
  HEV_TUNNEL_COMMIT: "d1178b52fccd8659201e1e3f83030f298c998865"
  DBIP_RELEASE: "2026-08"
  DBIP_ASN_SHA1: "60b92758094a72c531d795833e4198a7c48f1c02"
  DBIP_COUNTRY_SHA1: "2ca01eac8c6d8f375a2d615529519be75c580441"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: "9.1.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$PRIVACYGUARD_NDK_VERSION" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$PRIVACYGUARD_NDK_VERSION"
          fi
          test -x "$ANDROID_HOME/ndk/$PRIVACYGUARD_NDK_VERSION/ndk-build"

      - name: Fetch pinned HEV tun2socks
        shell: bash
        run: |
          rm -rf app/src/main/jni/hev-socks5-tunnel
          git clone --recursive --shallow-submodules --branch 2.17.0 --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel.git \
            app/src/main/jni/hev-socks5-tunnel
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "$HEV_TUNNEL_COMMIT"

      - name: Verify HEV JNI API compatibility
        shell: bash
        run: |
          JNI=app/src/main/jni/hev-socks5-tunnel/src/hev-jni.c
          grep -F 'static jboolean native_start_service' "$JNI"
          grep -F '"(Ljava/lang/String;I)Z"' "$JNI"
          grep -F '"TProxyIsRunning", "()Z"' "$JNI"
          grep -F '"TProxyGetStats", "()[J"' "$JNI"

      - name: Verify TCP socket materialization guard
        shell: bash
        run: |
          grep -F 'materializeTcpSocket(remote)' app/src/main/java/com/example/privacyguard/LocalSocks5Proxy.kt
          grep -F 'val ignored = socket.reuseAddress' app/src/main/java/com/example/privacyguard/LocalSocks5Proxy.kt

      - name: Verify safe area handling
        shell: bash
        run: |
          grep -F 'WindowCompat.enableEdgeToEdge(window)' app/src/main/java/com/example/privacyguard/SafeArea.kt
          grep -F 'WindowInsetsCompat.Type.systemBars()' app/src/main/java/com/example/privacyguard/SafeArea.kt
          grep -F 'WindowInsetsCompat.Type.displayCutout()' app/src/main/java/com/example/privacyguard/SafeArea.kt
          grep -F 'applySafeAreaInsets()' app/src/main/java/com/example/privacyguard/MainActivity.kt
          grep -F 'android:fitsSystemWindows="true"' app/src/main/res/layout/activity_app_detail.xml

      - name: Verify behavior timeline wiring
        shell: bash
        run: |
          grep -F 'TrafficTimelineStore.record(' app/src/main/java/com/example/privacyguard/ConnectionLogStore.kt
          grep -F 'MonitorSessionStore.start(context, packageName)' app/src/main/java/com/example/privacyguard/LiveMonitorStore.kt
          grep -F 'currentObservedMillis' app/src/main/java/com/example/privacyguard/TrafficTimelineStore.kt
          grep -F 'comparisonReady' app/src/main/java/com/example/privacyguard/TrafficTimelineStore.kt
          grep -F 'behaviorSummary' app/src/main/res/layout/activity_app_detail.xml
          grep -F 'renderBehaviorReport' app/src/main/java/com/example/privacyguard/AppDetailActivity.kt

      - name: Fetch pinned DB-IP Lite databases
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://download.db-ip.com/free/dbip-asn-lite-${DBIP_RELEASE}.mmdb.gz" \
            -o "$RUNNER_TEMP/dbip-asn.mmdb.gz"
          curl --fail --location --retry 3 \
            "https://download.db-ip.com/free/dbip-country-lite-${DBIP_RELEASE}.mmdb.gz" \
            -o "$RUNNER_TEMP/dbip-country.mmdb.gz"
          gzip -dc "$RUNNER_TEMP/dbip-asn.mmdb.gz" > "app/src/main/assets/dbip-asn-lite-${DBIP_RELEASE}.mmdb"
          gzip -dc "$RUNNER_TEMP/dbip-country.mmdb.gz" > "app/src/main/assets/dbip-country-lite-${DBIP_RELEASE}.mmdb"
          echo "$DBIP_ASN_SHA1  app/src/main/assets/dbip-asn-lite-${DBIP_RELEASE}.mmdb" | sha1sum -c -
          echo "$DBIP_COUNTRY_SHA1  app/src/main/assets/dbip-country-lite-${DBIP_RELEASE}.mmdb" | sha1sum -c -
          test "$(stat -c%s app/src/main/assets/dbip-asn-lite-${DBIP_RELEASE}.mmdb)" -gt 5000000
          test "$(stat -c%s app/src/main/assets/dbip-country-lite-${DBIP_RELEASE}.mmdb)" -gt 5000000

      - name: Verify server intelligence wiring
        shell: bash
        run: |
          grep -F 'com.maxmind.db:maxmind-db:4.1.0' app/build.gradle.kts
          grep -F 'ServerIntelligenceResolver' app/src/main/java/com/example/privacyguard/ServerIntelligenceView.kt
          grep -F 'No destination IP is sent to an online lookup service.' app/src/main/java/com/example/privacyguard/ServerIntelligenceView.kt
          grep -F 'ServerIntelligenceView' app/src/main/res/layout/activity_app_detail.xml
          grep -F 'DB-IP Lite' app/src/main/assets/SERVER_INTELLIGENCE_NOTICE.txt

      - name: Prepare fixed signing key
        if: env.SIGNING_KEY_BASE64 != ''
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/privacyguard-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "PRIVACYGUARD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          mkdir -p output
          if [ -n "${PRIVACYGUARD_KEYSTORE_PATH:-}" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk output/PrivacyGuard-0.7.0-signed.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk output/PrivacyGuard-0.7.0-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyGuard-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
